<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rudransh-Profile</title>
  </head>

  <body>
    <div class="custom-cursor"></div>
    <div class="start-screen">
      <h1>CLICK TO START</h1>
    </div>
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="Assets/bg-vid.mp4" type="video/mp4" />
    </video>
    <div class="spotify-widget" id="spotify"></div>
    <main class="website">
      <div class="card">
        <div class="profile-top">
          <img src="Assets/profile-1.webp" class="avatar" />
        </div>
        <h1 class="name">♛ 𝖱𝖴𝗗𝗥𝖠𝙽𝘚𝘏 ♛</h1>
        <div class="discord-profile">
          <div class="profile-main">
            <div class="avatar-box">
              <img id="discord-avatar" />
              <span id="status-dot"></span>
            </div>
            <div class="user-info">
              <div class="display-name" id="discord-display"></div>
              <div class="username" id="discord-username"></div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
