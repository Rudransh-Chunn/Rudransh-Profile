<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rudransh-Profile</title>
  </head>
  <body>
    <div class="custom-cursor"></div>
    <div class="start-screen">
      <h1>CLICK TO START</h1>
    </div>
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="Assets/bg-vid.mp4" type="video/mp4" />
    </video>
    <div class="spotify-widget" id="spotify"></div>
    <div class="audio-card">
      <button id="play-btn">▶</button>
      <button id="mute-btn">🔊</button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5" />
    </div>
    <audio id="bg-music" loop>
      <source src="Assets/bg-music.mp3" type="audio/mpeg" />
    </audio>
    <main class="website">
      <div class="card">
        <div class="profile-top">
          <img src="Assets/profile-1.webp" class="avatar" />
        </div>
        <h1 class="name">♛ 𝖱𝖴𝗗𝗥𝖠𝙽𝘚𝘏 ♛</h1>
        <div class="discord-profile">
          <div class="profile-main">
            <div class="avatar-box">
              <img id="discord-avatar" />
              <span id="status-dot"></span>
            </div>
            <div class="user-info">
              <div class="display-name" id="discord-display">Loading...</div>
              <div class="username">
                <span id="discord-username"></span>
                <span class="server-tag" id="server-tag"> 💎TPH </span>
              </div>
              <div class="status-text">
                <span id="status-text"></span>
              </div>
            </div>
          </div>
        </div>
        <div class="social-links">
          <a
            href="https://github.com/Rudransh-Chunn"
            target="_blank"
            class="social"
          >
            <img
              src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg"
            />
            <span>GitHub</span>
          </a>

          <a
            href="https://open.spotify.com/user/31jsdwpmiyb5xkgs6jgkhh2rrgna?si=8126aca02cea42f0"
            target="_blank"
            class="social"
          >
            <img
              src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/spotify.svg"
            />
            <span>Spotify</span>
          </a>

          <a href="mailto:rudranshchunn2k13@gmail.com" class="social">
            <img
              src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg"
            />
            <span>Mail</span>
          </a>

          <a
            href="https://rudranshchunn.netlify.app"
            target="_blank"
            class="social"
          >
            <img
              src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/googlechrome.svg"
            />
            <span>Site</span>
          </a>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
